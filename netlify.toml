[build]
  publish = "."
  # Solo publicar cuando cambia la página o los datos (los cambios del scraper no gastan créditos).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html datos.json"

[[headers]]
  for = "/datos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
